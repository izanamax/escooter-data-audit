name: CI and delivery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and command-line tests
        run: python -m unittest discover -s tests -v
      - name: Strict audit of synthetic example splits
        run: python -m escooter_audit --split train=examples/train.json --split val=examples/val.json --split test=examples/test.json --require-sequences --output outputs/example-audit.json

  deliver:
    name: Build, install and deliver package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build wheel and source archive
        run: python -m build --no-isolation
      - name: Test installed wheel outside the source directory
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/audit-wheel-env"
          "$RUNNER_TEMP/audit-wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/audit-wheel-env/bin/escooter-audit" \
            --split "train=$GITHUB_WORKSPACE/examples/train.json" \
            --split "val=$GITHUB_WORKSPACE/examples/val.json" \
            --split "test=$GITHUB_WORKSPACE/examples/test.json" \
            --require-sequences --output "$GITHUB_WORKSPACE/outputs/example-audit.json"
      - name: Deliver tested distributions and example report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: escooter-data-audit-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            outputs/example-audit.json
